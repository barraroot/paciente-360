        headers: []
        description: 'tenant criado'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - GET
    uri: api/v1/tenant
    metadata:
      custom: []
      groupName: Tenant
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Leitura do tenant atual.'
      description: |-
        Retorna dados públicos do tenant ativo (branding, status de trial,
