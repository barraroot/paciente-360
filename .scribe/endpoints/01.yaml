      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"id": 1, "slug": "clinica-alfa", "status": "trial"}'
        headers: []
        description: 'tenant ativo'
      -
        custom: []
        status: 404
        content: '{"message": "Tenant não encontrado."}'
        headers: []
        description: 'subdomínio inválido'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
