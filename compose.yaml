services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
            mailpit:
                condition: service_started
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    reverb:
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${REVERB_SERVER_PORT:-8080}:8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        working_dir: /var/www/html
        command:
            - php
            - artisan
            - reverb:start
            - '--host=0.0.0.0'
            - '--port=8080'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_started
            redis:
                condition: service_healthy
        restart: unless-stopped
    horizon:
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        working_dir: /var/www/html
        command:
            - php
            - artisan
            - horizon
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_started
            redis:
                condition: service_healthy
            pgsql:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test:
                - CMD
                - php
                - artisan
                - horizon:status
            interval: 30s
            timeout: 10s
            retries: 3
    # Streaming de logs em tempo real (Princípio V — Observabilidade).
    # Service opcional ativado via profile: `vendor/bin/sail --profile pail up -d pail`
    # ou `COMPOSE_PROFILES=pail vendor/bin/sail up -d`. Para uso ad-hoc,
    # `vendor/bin/sail artisan pail` continua funcionando no container principal.
    pail:
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        working_dir: /var/www/html
        command:
            - php
            - artisan
            - pail
            - '--timeout=0'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_started
        profiles:
            - pail
        tty: true
        stdin_open: true
        restart: unless-stopped
    # Feature 014 — Evolution API v2 (WhatsApp NÃO oficial via Baileys).
    # Opt-in via profile: `vendor/bin/sail --profile evolution up -d evolution-api`
    # ou `COMPOSE_PROFILES=evolution vendor/bin/sail up -d`.
    # Auto-hospedado: a app fala com ele em http://evolution-api:8080 (rede sail).
    # Porta de host 8085 (8080 já é usada pelo reverb). Reusa pgsql (schema `evolution`)
    # e redis (DB index 2).
    evolution-api:
        image: 'evoapicloud/evolution-api:latest'
        ports:
            - '${FORWARD_EVOLUTION_PORT:-8085}:8080'
        environment:
            SERVER_URL: '${EVOLUTION_SERVER_URL:-http://localhost:8085}'
            AUTHENTICATION_API_KEY: '${EVOLUTION_API_KEY}'
            DATABASE_ENABLED: 'true'
            DATABASE_PROVIDER: postgresql
            DATABASE_CONNECTION_URI: 'postgresql://${DB_USERNAME}:${DB_PASSWORD:-secret}@pgsql:5432/${DB_DATABASE}?schema=evolution'
            DATABASE_CONNECTION_CLIENT_NAME: evolution
            CACHE_REDIS_ENABLED: 'true'
            CACHE_REDIS_URI: 'redis://redis:6379/2'
            CACHE_REDIS_PREFIX_KEY: evolution
            CACHE_LOCAL_ENABLED: 'false'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        profiles:
            - evolution
        restart: unless-stopped
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
