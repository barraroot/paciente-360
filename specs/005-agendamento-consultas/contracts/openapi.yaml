openapi: 3.1.0
info:
  title: Paciente360 — Agenda de Consultas (Fase 5)
  version: 1.0.0
  description: |
    API REST do módulo de agendamento. Todas as rotas exigem:
    - `Authorization: Bearer <paciente360_token>` (Fase 4)
    - `X-Tenant-Slug: <tenant-slug>` (Fase 4 triple-check)
    Exceções: webhooks Google (header `X-Goog-Channel-Token` HMAC) e OAuth callback Google (state CSRF).

servers:
  - url: https://api.paciente360.com.br/api/v1
    description: Production
  - url: http://api.paciente360.test/api/v1
    description: Local (Sail)

tags:
  - name: AppointmentTypes
    description: Tipos de atendimento (US-6.2)
  - name: ProfessionalSchedules
    description: Configuração de agenda do profissional (US-6.1)
  - name: ScheduleExceptions
    description: Bloqueios pontuais (US-6.1)
  - name: Slots
    description: Slots disponíveis + reserva pessimista soft (US-6.3, US-6.5)
  - name: Appointments
    description: Consultas — CRUD, reagendar, cancelar, marcar comparecimento (US-6.3, US-6.4, US-6.5)
  - name: Waitlist
    description: Lista de espera FIFO sequencial (US-6.6)
  - name: CalendarSync
    description: Sincronização Google Calendar (US-6.7)
  - name: GoogleWebhooks
    description: Push notifications do Google Calendar
  - name: Confirmations
    description: Resposta de confirmação ingestada via Fase 3 (interno)

security:
  - bearerAuth: []
  - tenantSlug: []

paths:
  # =========================================================================
  # AppointmentTypes (US-6.2)
  # =========================================================================
  /agenda/appointment-types:
    get:
      tags: [AppointmentTypes]
      summary: Lista tipos de atendimento do tenant
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AppointmentType' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [AppointmentTypes]
      summary: Cria tipo de atendimento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentTypeCreate' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AppointmentType' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /agenda/appointment-types/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [AppointmentTypes]
      summary: Detalhe do tipo
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AppointmentType' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [AppointmentTypes]
      summary: Atualiza tipo
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentTypeUpdate' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AppointmentType' }
    delete:
      tags: [AppointmentTypes]
      summary: Inativa tipo (não deleta — preserva histórico FR-007)
      responses:
        '204': { description: Inativado }

  # =========================================================================
  # ProfessionalSchedules (US-6.1)
  # =========================================================================
  /agenda/professionals/{professionalId}/schedules:
    parameters:
      - { name: professionalId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [ProfessionalSchedules]
      summary: Agenda recorrente do profissional (7 dias da semana + tipos aceitos)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProfessionalScheduleFull' }
    put:
      tags: [ProfessionalSchedules]
      summary: Configura/atualiza agenda recorrente em batch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfessionalScheduleUpdate' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProfessionalScheduleFull' }

  /agenda/professionals/{professionalId}/schedule-exceptions:
    parameters:
      - { name: professionalId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [ScheduleExceptions]
      summary: Bloqueios pontuais do profissional
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleException' }
    post:
      tags: [ScheduleExceptions]
      summary: Cria bloqueio (médico próprio com `appointment.manage_own_schedule` OU admin com `schedule.configure`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleExceptionCreate' }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScheduleException' }
                  cascaded_cancellations:
                    description: Consultas canceladas automaticamente (FR-028c)
                    type: array
                    items: { type: string, format: uuid }

  /agenda/schedule-exceptions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [ScheduleExceptions]
      summary: Remove bloqueio
      responses:
        '204': { description: Removido }

  # =========================================================================
  # Slots (US-6.3, US-6.5)
  # =========================================================================
  /agenda/slots-disponiveis:
    get:
      tags: [Slots]
      summary: Lista slots disponíveis para combinação profissional + tipo + janela
      parameters:
        - { name: professional_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: appointment_type_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time, description: "ISO 8601 com offset" } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: Slots disponíveis (paginado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
                  timezone_display:
                    type: string
                    example: America/Sao_Paulo
                    description: IANA TZ recomendado para render (clarify nº 13)
        '422': { $ref: '#/components/responses/ValidationError' }

  /agenda/slots/{starts_at}/reservar:
    parameters:
      - { name: starts_at, in: path, required: true, schema: { type: string, format: date-time } }
    post:
      tags: [Slots]
      summary: Reserva pessimista soft (clarify nº 2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlotReservationCreate' }
      responses:
        '201':
          description: Reserva criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SlotReservation' }
        '409':
          description: Slot já reservado por outro holder
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: slot_already_reserved }
                  holder_type: { type: string, enum: [user, ia] }
                  expires_at: { type: string, format: date-time }
                  message: { type: string }
  /agenda/slot-reservations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Slots]
      summary: Libera reserva explicitamente (form fechado)
      responses:
        '204': { description: Liberada }
        '404': { $ref: '#/components/responses/NotFound' }

  # =========================================================================
  # Appointments (US-6.3, US-6.4, US-6.5)
  # =========================================================================
  /agenda/consultas:
    get:
      tags: [Appointments]
      summary: Lista consultas com filtros
      parameters:
        - { name: professional_id, in: query, schema: { type: string, format: uuid } }
        - { name: patient_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: array, items: { type: string, enum: [scheduled, confirmed, canceled, realizada, nao_realizada, concluida_sem_registro] } } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
                  timezone_display: { type: string, example: America/Sao_Paulo }
    post:
      tags: [Appointments]
      summary: Cria consulta (manual via painel ou IA Matricial)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentCreate' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }
                  idempotent_replay: { type: boolean, description: "True se idempotency_key bateu com registro existente" }
        '409':
          description: Slot conflict (FR-011a)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: slot_conflict }
        '422':
          description: Validação (incluindo `professional_schedule_not_configured`, `appointment_type_inactive`, `appointment_type_not_supported`)
          $ref: '#/components/responses/ValidationError'

  /agenda/consultas/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Appointments]
      summary: Detalhe da consulta
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }
                  timezone_display: { type: string, example: America/Sao_Paulo }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Appointments]
      summary: Edição menor (notas, valor_override_motivo) — NÃO move horário
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentUpdate' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }

  /agenda/consultas/{id}/reagendar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Appointments]
      summary: Reagenda consulta (mantém prof+tipo — clarify nº 7)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentReschedule' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }
        '422':
          description: |
            Validação. Erros possíveis:
            - `reschedule_limit_exceeded` (clarify nº 7 — `escalated_to_inbox=true`)
            - `slot_conflict`
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  escalated_to_inbox: { type: boolean }
                  current_count: { type: integer }
                  limit: { type: integer }

  /agenda/consultas/{id}/cancelar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Appointments]
      summary: Cancela consulta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentCancel' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }
        '422':
          description: |
            Erros:
            - `cancellation_outside_window` (clarify nº 3 — `escalated_to_inbox=true`, `window_hours`, `current_hours_until_appt`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: cancellation_outside_window }
                  escalated_to_inbox: { type: boolean }
                  window_hours: { type: integer }
                  current_hours_until_appt: { type: number }

  /agenda/consultas/{id}/marcar-comparecimento:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Appointments]
      summary: Marca consulta como realizada / não realizada (clarify nº 14)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendanceMark' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }
        '403':
          description: Após 48h, exige ability `appointment.revert_attendance_marking`
        '422':
          description: Janela 7d expirada (`appointment_too_old_for_marking`)

  /agenda/consultas/{id}/reverter-comparecimento:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Appointments]
      summary: Reverte marcação (48h ou ability `appointment.revert_attendance_marking`)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }

  # =========================================================================
  # Confirmações (US-6.4) — endpoint interno chamado pela Fase 3 quando paciente responde
  # =========================================================================
  /agenda/consultas/{id}/confirmar-resposta:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Confirmations]
      summary: Ingesta resposta do paciente vinda da Fase 3 (`1` confirma / `2` remarca / `3` cancela)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_value, dispatch_kind]
              properties:
                response_value: { type: string, enum: ['1', '2', '3'] }
                dispatch_kind: { type: string, enum: [24h, 2h, retry_30min, via_ia] }
                received_at: { type: string, format: date-time }
      responses:
        '200':
          description: Resposta processada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }
                  emitted_event: { type: string, example: ConsultaConfirmada }

  # =========================================================================
  # Waitlist (US-6.6)
  # =========================================================================
  /agenda/waitlist:
    get:
      tags: [Waitlist]
      summary: Lista entries da lista de espera
      parameters:
        - { name: professional_id, in: query, schema: { type: string, format: uuid } }
        - { name: appointment_type_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [waiting, notified, accepted, expired, canceled] } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WaitlistEntry' }
    post:
      tags: [Waitlist]
      summary: Inscreve paciente na lista de espera
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitlistEntryCreate' }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WaitlistEntry' }

  /agenda/waitlist/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Waitlist]
      summary: Remove entry (paciente desiste)
      responses:
        '204': { description: Removida }

  /agenda/waitlist/{id}/aceitar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Waitlist]
      summary: Aceita vaga oferecida (status=notified → accepted, cria Appointment atômico)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key: { type: string, format: uuid }
      responses:
        '200':
          description: Aceitou; consulta criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WaitlistEntry' }
                  appointment: { $ref: '#/components/schemas/Appointment' }
        '422':
          description: |
            Erros:
            - `waitlist_offer_expired` (clarify nº 8 — passou os 15min)
            - `slot_no_longer_available` (defesa em profundidade — FR-033)

  # =========================================================================
  # CalendarSync — Google OAuth (US-6.7, clarify nº 10/15)
  # =========================================================================
  /agenda/calendar-sync/google/connect:
    post:
      tags: [CalendarSync]
      summary: Inicia fluxo OAuth Google (retorna URL de redirect)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorize_url: { type: string, format: uri, example: "https://accounts.google.com/o/oauth2/v2/auth?..." }
                  state: { type: string, description: "CSRF token persistido em session" }

  /agenda/calendar-sync/google/callback:
    get:
      tags: [CalendarSync]
      summary: Callback OAuth Google (chamado pelo Google após consent)
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: |
            Conexão estabelecida + sub-calendário criado (clarify nº 15).
            Falha de criação do sub-calendário retorna 422 `calendar_subcalendar_creation_failed`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CalendarSyncAccount' }

  /agenda/calendar-sync/google/disconnect:
    post:
      tags: [CalendarSync]
      summary: Desconecta Google Calendar (revoke + stop watch channel; eventos no Google permanecem)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CalendarSyncAccount' }

  /agenda/calendar-sync:
    get:
      tags: [CalendarSync]
      summary: Status da sync do profissional autenticado
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - { $ref: '#/components/schemas/CalendarSyncAccount' }
                      - { type: 'null' }

  # =========================================================================
  # Google Webhooks — push notifications
  # =========================================================================
  /webhooks/google-calendar/{channelId}:
    parameters:
      - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [GoogleWebhooks]
      summary: Recebe push notification do Google Calendar Watch channel
      description: |
        Validado via header `X-Goog-Channel-Token` (HMAC do tenant_id+professional_id+channel_id).
        Mesmo em falha de validação, retorna HTTP 200 para evitar retry storms; erros logados Sentry.
      security: []  # webhook não usa Bearer
      parameters:
        - { name: X-Goog-Channel-Id, in: header, required: true, schema: { type: string } }
        - { name: X-Goog-Channel-Token, in: header, required: true, schema: { type: string } }
        - { name: X-Goog-Resource-Id, in: header, required: true, schema: { type: string } }
        - { name: X-Goog-Resource-State, in: header, required: true, schema: { type: string, enum: [sync, exists, not_exists] } }
        - { name: X-Goog-Message-Number, in: header, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Ack (sempre 200, mesmo em erro interno)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    tenantSlug:
      type: apiKey
      name: X-Tenant-Slug
      in: header

  parameters:
    IncludeInactive:
      name: include_inactive
      in: query
      schema: { type: boolean, default: false }

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }

  schemas:
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    AppointmentType:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        slug: { type: string }
        duration_minutes: { type: integer }
        buffer_minutes: { type: integer }
        valor_particular: { type: number, format: float }
        valor_convenio_default: { type: number, format: float, nullable: true }
        min_cancellation_hours: { type: integer, nullable: true, description: "Override; herda tenant se null (clarify nº 3)" }
        cor: { type: string, example: "#3B82F6" }
        descricao: { type: string, nullable: true }
        intent_ia: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AppointmentTypeCreate:
      type: object
      required: [nome, duration_minutes, valor_particular]
      properties:
        nome: { type: string, minLength: 1, maxLength: 100 }
        duration_minutes: { type: integer, minimum: 5, maximum: 600 }
        buffer_minutes: { type: integer, default: 0, minimum: 0, maximum: 120 }
        valor_particular: { type: number, format: float, minimum: 0 }
        valor_convenio_default: { type: number, format: float, minimum: 0, nullable: true }
        min_cancellation_hours: { type: integer, minimum: 0, nullable: true }
        cor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        descricao: { type: string, nullable: true }
        intent_ia: { type: string, nullable: true }

    AppointmentTypeUpdate:
      allOf:
        - $ref: '#/components/schemas/AppointmentTypeCreate'
        - type: object
          properties:
